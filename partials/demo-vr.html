<div class="hiw-panel" id="hiw-panel-vr" aria-label="Pipeline demo">
      <div class="hiw-setup">
        <div class="hiw-actions">
          <button type="button" class="hiw-run">▶ Run the call</button>
          <button type="button" class="hiw-reset" hidden>↺ Reset</button>
        </div>
      </div>
      <div class="hiw-wrap">
        <canvas class="hiw-flow" id="hiw-flow-vr" width="640" height="300" role="group" aria-label="AI Voice Receptionist call-flow map — click a node for details" tabindex="0"></canvas>
        <button type="button" class="hiw-pause" data-pause="vr" aria-label="Pause packet animation" aria-pressed="false">⏸</button>
      </div>
      <div class="hiw-metrics">
        <div class="hiw-metric"><span class="hiw-metric-label">Current Stage</span><span class="hiw-metric-value" id="hiw-m-stage-vr">Missed call</span></div>
        <div class="hiw-metric"><span class="hiw-metric-label">Live Packets</span><span class="hiw-metric-value" id="hiw-m-packets-vr">15</span></div>
        <div class="hiw-metric"><span class="hiw-metric-label">Status</span><span class="hiw-metric-value hiw-metric-ok" id="hiw-m-status-vr">healthy</span></div>
      </div>
      <div class="hiw-inspect" id="hiw-detail-vr">
        <div class="hiw-ins-head">
          <span class="hiw-ins-dot"></span>
          <span class="hiw-ins-icon">📵</span>
          <span class="hiw-ins-name">Missed call → Retell</span>
          <span class="hiw-ins-tag">Retell + phone number</span>
        </div>
        <p class="hiw-ins-desc">Nobody picks up, or it's after hours. Retell answers instantly with a voice agent — 24/7.</p>
        <div class="hiw-visual"></div>
      </div>
      <div class="hiw-console">
        <div class="hiw-cgroup">
          <span class="hiw-clabel">Pipeline velocity</span>
          <div class="hiw-slider-row">
            <input type="range" class="hiw-slider" id="hiw-speed-vr" min="0" max="3" step="0.5" value="1" aria-label="Packet speed" />
            <span class="hiw-slider-val" id="hiw-speed-val-vr">1.0x</span>
          </div>
        </div>
        <div class="hiw-cgroup">
          <span class="hiw-clabel">Call type</span>
          <div class="hiw-toggle">
            <button type="button" class="hiw-chip is-active" data-scenario="bookable" aria-pressed="true">Bookable</button>
            <button type="button" class="hiw-chip" data-scenario="question" aria-pressed="false">Question</button>
            <button type="button" class="hiw-chip" data-scenario="invalid" aria-pressed="false">Past slot</button>
          </div>
        </div>
        <div class="hiw-cgroup">
          <span class="hiw-clabel">Branch platform</span>
          <div class="hiw-select-wrap">
            <select class="hiw-select hiw-platform" id="hiw-platform-vr" aria-label="Which platform branch handles the call">
              <option value="make">Make.com</option>
              <option value="n8n" selected>n8n · self-hosted</option>
              <option value="zapier">Zapier</option>
            </select>
          </div>
        </div>
      </div>
      <p class="hiw-status" aria-live="polite">Ready — hit “Run the call”.</p>
    </div>
