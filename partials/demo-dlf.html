<div class="hiw-panel" id="hiw-panel-dlf" aria-label="Pipeline demo" hidden>
      <div class="hiw-setup">
        <fieldset class="hiw-lead-card">
          <legend>📋 Tonight's dead lead — edit me</legend>
          <label>Name <input id="hiw-lead-name" type="text" value="Bea Mendoza" maxlength="40" autocomplete="off" /></label>
          <label>Company <input id="hiw-lead-company" type="text" value="Sunnyside Prints" maxlength="40" autocomplete="off" /></label>
          <label>Original interest <input id="hiw-lead-interest" type="text" value="automating their Etsy order fulfilment" maxlength="60" autocomplete="off" /></label>
        </fieldset>
        <div class="hiw-actions">
          <button type="button" class="hiw-run">▶ Run the pipeline</button>
          <button type="button" class="hiw-reset" hidden>↺ Reset</button>
        </div>
      </div>
      <div class="hiw-wrap">
        <canvas class="hiw-flow" id="hiw-flow-dlf" width="640" height="300" role="group" aria-label="Dead Lead Retrieval pipeline map — click a node for details" tabindex="0"></canvas>
        <button type="button" class="hiw-pause" data-pause="dlf" aria-label="Pause packet animation" aria-pressed="false">⏸</button>
      </div>
      <div class="hiw-metrics">
        <div class="hiw-metric"><span class="hiw-metric-label">Current Stage</span><span class="hiw-metric-value" id="hiw-m-stage-dlf">Schedule Trigger</span></div>
        <div class="hiw-metric"><span class="hiw-metric-label">Live Packets</span><span class="hiw-metric-value" id="hiw-m-packets-dlf">15</span></div>
        <div class="hiw-metric"><span class="hiw-metric-label">Status</span><span class="hiw-metric-value hiw-metric-ok" id="hiw-m-status-dlf">healthy</span></div>
      </div>
      <div class="hiw-inspect" id="hiw-detail-dlf">
        <div class="hiw-ins-head">
          <span class="hiw-ins-dot"></span>
          <span class="hiw-ins-icon">⏰</span>
          <span class="hiw-ins-name">Schedule Trigger</span>
          <span class="hiw-ins-tag">n8n · scheduleTrigger</span>
        </div>
        <p class="hiw-ins-desc">The pipeline wakes up every morning at 10:00 — nobody clicks anything.</p>
        <div class="hiw-visual"></div>
      </div>
      <div class="hiw-console">
        <div class="hiw-cgroup">
          <span class="hiw-clabel">Pipeline velocity</span>
          <div class="hiw-slider-row">
            <input type="range" class="hiw-slider" id="hiw-speed-dlf" min="0" max="3" step="0.5" value="1" aria-label="Packet speed" />
            <span class="hiw-slider-val" id="hiw-speed-val-dlf">1.0x</span>
          </div>
        </div>
        <div class="hiw-cgroup">
          <span class="hiw-clabel">Failure drill</span>
          <div class="hiw-select-wrap">
            <select class="hiw-select hiw-drill" id="hiw-drill-dlf" aria-label="Simulate a pipeline disturbance">
              <option value="none">No errors</option>
              <option value="429">LLM rate limit (429)</option>
              <option value="dup">Duplicate lead</option>
            </select>
          </div>
        </div>
      </div>
      <p class="hiw-status" aria-live="polite">Ready — hit “Run the pipeline”.</p>
    </div>
